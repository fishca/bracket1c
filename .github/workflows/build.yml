name: Build and Release 1C Bracket Reader

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [created]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            qt_arch: linux_64
            artifact_name: 1CBracketReader-linux
            qt_modules: 'qtbase'
            static_flag: '-DBUILD_STATIC=ON'
            archive_ext: tar.gz
          - os: windows-latest
            qt_arch: win64_msvc2019_64
            artifact_name: 1CBracketReader-windows
            qt_modules: 'qtbase'
            static_flag: '-DBUILD_STATIC=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded'
            archive_ext: zip
          - os: macos-latest
            qt_arch: clang_64
            artifact_name: 1CBracketReader-macos
            qt_modules: 'qtbase'
            static_flag: '-DBUILD_STATIC=ON'
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt (Static)
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.0'
        arch: ${{ matrix.qt_arch }}
        target: 'desktop'
        setup-python: 'true'
        install-deps: 'true'

    - name: Setup Build Environment (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libgl1-mesa-dev \
          libxkbcommon-dev \
          libdbus-1-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcb-glx0-dev \
          libxcb-dri2-0-dev \
          libxcb-dri3-0-dev \
          libxcb-present0-dev \
          libxcb-randr0-dev \
          libxcb-shape0-dev \
          libxcb-shm0-dev \
          libxcb-sync-dev \
          libxcb-xfixes0-dev \
          libxcb-xinerama0-dev \
          libxext-dev \
          libxrender-dev \
          libxi-dev \
          libxcursor-dev \
          libxcomposite-dev \
          libxdamage-dev \
          libxfixes-dev \
          libxtst-dev \
          libepoxy-dev \
          libdrm-dev \
          libgbm-dev \
          libpulse-dev \
          libasound2-dev

    - name: Setup Build Environment (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake ninja

    - name: Configure CMake (Static Build)
      shell: bash
      working-directory: 1c-bracket-reader
      run: |
        rm -rf build
        cmake -S . -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR \
          ${{ matrix.static_flag }} \
          -DCMAKE_INSTALL_PREFIX=install

    - name: Build
      working-directory: 1c-bracket-reader
      run: |
        cmake --build build --config Release --parallel

    - name: Install
      working-directory: 1c-bracket-reader
      run: |
        cmake --install build --config Release

    - name: Prepare Artifacts (Linux)
      if: matrix.os == 'ubuntu-latest'
      working-directory: 1c-bracket-reader
      run: |
        mkdir -p artifact
        cp build/1CBracketReader artifact/
        cd artifact
        tar -czvf ../${{ matrix.artifact_name }}.${{ matrix.archive_ext }} .

    - name: Prepare Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: 1c-bracket-reader
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifact
        Copy-Item -Path build/Release/1CBracketReader.exe -Destination artifact/ -Force
        Compress-Archive -Path artifact/* -DestinationPath ${{ matrix.artifact_name }}.${{ matrix.archive_ext }} -Force

    - name: Prepare Artifacts (macOS)
      if: matrix.os == 'macos-latest'
      working-directory: 1c-bracket-reader
      run: |
        mkdir -p artifact
        if [ -d "build/1CBracketReader.app" ]; then
          cp -R build/1CBracketReader.app artifact/
        else
          cp build/1CBracketReader artifact/
        fi
        cd artifact
        tar -czvf ../${{ matrix.artifact_name }}.${{ matrix.archive_ext }} .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
        retention-days: 30

    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 1CBracketReader-*
          merge-multiple: false
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts

      - name: Create release notes
        run: |
          echo "## Доступные версии для скачивания:" > release_notes.md
          echo "" >> release_notes.md
          echo "- **Windows**: 1CBracketReader-windows.zip" >> release_notes.md
          echo "- **Linux**: 1CBracketReader-linux.tar.gz" >> release_notes.md
          echo "- **macOS**: 1CBracketReader-macos.tar.gz" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Инструкция по установке:" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Windows:" >> release_notes.md
          echo "1. Распакуйте архив 1CBracketReader-windows.zip" >> release_notes.md
          echo "2. Запустите 1CBracketReader.exe" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Linux:" >> release_notes.md
          echo "1. Распакуйте архив: tar -xzf 1CBracketReader-linux.tar.gz" >> release_notes.md
          echo "2. Сделайте файл исполняемым: chmod +x 1CBracketReader" >> release_notes.md
          echo "3. Запустите: ./1CBracketReader" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### macOS:" >> release_notes.md
          echo "1. Распакуйте архив: tar -xzf 1CBracketReader-macos.tar.gz" >> release_notes.md
          echo "2. Если создан .app бандл, перетащите его в Applications" >> release_notes.md
          echo "3. Запустите приложение" >> release_notes.md

      - name: Update release with notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
